<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marca de Agua GPS</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;color:#111}
  main{max-width:1000px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:4px 0 16px}
  .card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{grid-column:1/-1}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
  input,textarea,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font:inherit}
  textarea{resize:vertical;min-height:54px}
  button{padding:9px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.sec{background:#e5e7eb;color:#111}
  button.del{background:#dc2626}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .row>div{flex:1;min-width:180px}
  #drop{border:2px dashed #9ca3af;border-radius:10px;padding:28px;text-align:center;cursor:pointer;background:#fafafa}
  #drop.over{border-color:#2563eb;background:#eff6ff}
  #thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
  .th{position:relative;background:#000;border-radius:8px;overflow:hidden}
  .th canvas{width:100%;display:block}
  .th .x{position:absolute;top:6px;right:6px;padding:2px 8px;background:#000a}
  .th .dl{position:absolute;top:6px;left:6px;padding:4px 8px;font-size:12px}
  .muted{color:#666;font-size:13px}
  #map{height:340px;border-radius:8px;margin-top:8px;background:#e5e7eb}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>📍 Marca de agua: ubicación, coordenadas y fecha</h1>

  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <div>
        <label for="saved">Ubicaciones guardadas</label>
        <select id="saved"><option value="">— Seleccionar —</option></select>
      </div>
      <button class="del" id="delLoc" type="button">Borrar</button>
    </div>
    <div class="grid">
      <div class="full">
        <label for="addr">Dirección (Enter = nueva línea) <span class="muted" id="geoStatus"></span></label>
        <textarea id="addr" placeholder="Carretera Castillo-El Factor, 33200&#10;El Factor"></textarea>
      </div>
      <div><label for="lat">Latitud</label><input id="lat" type="number" step="any" placeholder="19.254043"></div>
      <div><label for="lon">Longitud</label><input id="lon" type="number" step="any" placeholder="-69.916246"></div>
      <div><label for="dt">Día y hora</label><input id="dt" type="datetime-local"></div>
      <div class="row">
        <button class="sec" id="gps" type="button">Usar mi GPS</button>
        <button class="sec" id="mapBtn" type="button">Mapa</button>
        <button id="saveLoc" type="button">Guardar ubicación</button>
      </div>
      <div class="full" id="mapBox" hidden>
        <div class="row">
          <div><input id="q" type="search" placeholder="Buscar lugar o pegar coordenadas y Enter"></div>
          <button class="sec" id="qBtn" type="button">Buscar</button>
        </div>
        <div id="map"></div>
        <span class="muted">Toca el mapa o arrastra el pin para fijar la ubicación <span id="mapSrc"></span></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div id="drop">
      <strong>Arrastra las fotos aquí</strong><br>
      <span class="muted">o haz clic para abrir el explorador</span>
      <input id="file" type="file" accept="image/*" multiple hidden>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="dlAll" type="button" disabled>Descargar todas</button>
      <button class="sec" id="clear" type="button">Limpiar</button>
      <span class="muted" id="count"></span>
    </div>
    <div id="thumbs"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = 'mw_locations';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let photos = []; // {file, prev: ImageBitmap, canvas}

// ---------- Ubicaciones en caché ----------
const loadLocs = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const storeLocs = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch {} };
function renderLocs() {
  const sel = $('saved');
  sel.length = 1;
  loadLocs().forEach((l, i) => sel.add(new Option(l.addr.split('\n')[0] + ` (${l.lat}, ${l.lon})`, i)));
}
$('saveLoc').onclick = () => {
  const loc = { addr: $('addr').value.trim(), lat: $('lat').value, lon: $('lon').value };
  if (!loc.addr && !loc.lat) return alert('Escribe una dirección o coordenadas');
  const l = loadLocs().filter(x => !(x.addr === loc.addr && x.lat === loc.lat && x.lon === loc.lon));
  l.unshift(loc); storeLocs(l); renderLocs(); $('saved').value = 0;
};
$('saved').onchange = e => {
  const l = loadLocs()[e.target.value];
  if (!l) return;
  cancelGeo(); // que una búsqueda pendiente no pise la dirección guardada
  $('addr').value = l.addr; $('lat').value = l.lat; $('lon').value = l.lon;
  refresh();
};
$('delLoc').onclick = () => {
  const i = $('saved').value;
  if (i === '') return;
  const l = loadLocs(); l.splice(i, 1); storeLocs(l); renderLocs();
};
$('gps').onclick = () => {
  if (!navigator.geolocation) return alert('GPS no disponible');
  navigator.geolocation.getCurrentPosition(
    p => pick(p.coords.latitude, p.coords.longitude, true, true),
    e => alert('No se pudo obtener ubicación: ' + e.message), { enableHighAccuracy: true });
};

// ---------- Dirección automática desde coordenadas ----------
// OpenStreetMap (Nominatim) aporta la calle. BigDataCloud aporta la localidad (más precisa en zonas rurales),
// pero su API gratuita solo se permite con la ubicación real del dispositivo: se usa solo con "Usar mi GPS".
let geoTimer, geoReq = 0, nextNomi = 0;
const geoCache = {};
const uniq = a => a.filter((v, i) => v && a.indexOf(v) === i);
const validPos = (lat, lon) => Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
const COORD_RE = /(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/;
const getJSON = url => fetch(url).then(r => r.ok ? r.json() : {}).catch(() => ({}));
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Nominatim permite máximo 1 petición por segundo
async function nominatim(path, stale) {
  while (Date.now() < nextNomi) {
    await sleep(nextNomi - Date.now());
    if (stale && stale()) return {}; // ya no hace falta: hubo otro clic o cambio
  }
  nextNomi = Date.now() + 1100;
  return getJSON('https://nominatim.openstreetmap.org/' + path + '&format=jsonv2&accept-language=es');
}
async function lookup(lat, lon, fromGps, stale) {
  const [osm, bdc] = await Promise.all([
    nominatim(`reverse?zoom=17&lat=${lat}&lon=${lon}`, stale),
    fromGps ? getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`) : {}
  ]);
  const a = osm.address || {};
  const road = [a.road || a.pedestrian, a.house_number].filter(Boolean).join(' ');
  const place = bdc.locality || a.suburb || a.village || a.town || a.city || '';
  const city = bdc.city || a.city || a.town || a.county || '';
  const prov = bdc.principalSubdivision || a.state || '';
  const lines = road
    ? [[road, a.postcode].filter(Boolean).join(', '), uniq([place, city]).join(', ')]
    : [uniq([place, city]).join(', '), prov];
  const out = uniq(lines).join('\n');
  if (!out) throw 0;
  return out;
}
// Descarta búsquedas pendientes (al escribir la dirección a mano o elegir una ubicación guardada)
function cancelGeo() { clearTimeout(geoTimer); geoReq++; $('geoStatus').textContent = ''; }
function geocode(delay = 900, fromGps = false) {
  cancelGeo();
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  if (!validPos(lat, lon)) return;
  const id = geoReq;
  geoTimer = setTimeout(async () => {
    const key = lat.toFixed(5) + ',' + lon.toFixed(5) + (fromGps ? ',gps' : '');
    $('geoStatus').textContent = '· buscando…';
    try {
      const stale = () => id !== geoReq; // hubo otro cambio después de esta búsqueda
      if (!geoCache[key]) { const r = await lookup(lat, lon, fromGps, stale); if (stale()) return; geoCache[key] = r; }
      if (stale()) return;
      $('addr').value = geoCache[key];
      $('geoStatus').textContent = '';
      refresh();
    } catch { if (id === geoReq) $('geoStatus').textContent = '· no se encontró dirección, escríbela a mano'; }
  }, delay);
}
// Fija una ubicación (desde el GPS, el mapa, la búsqueda o coordenadas pegadas)
function pick(lat, lon, pan, fromGps = false) {
  $('lat').value = (+lat).toFixed(6);
  $('lon').value = (+lon).toFixed(6);
  syncMap(pan);
  refresh(); geocode(fromGps ? 0 : 150, fromGps);
}
$('addr').addEventListener('input', cancelGeo);
['lat', 'lon'].forEach(id => {
  $(id).addEventListener('input', () => geocode());
  // pegar "19.254043, -69.916246" (copiado de Google Maps) llena ambos campos
  $(id).addEventListener('paste', e => {
    const m = e.clipboardData.getData('text').match(COORD_RE);
    if (!m || !validPos(+m[1], +m[2])) return;
    e.preventDefault();
    pick(m[1], m[2], true);
  });
});

// ---------- Mapa (OpenStreetMap con Leaflet, se carga solo al abrirlo) ----------
const DR = [18.7357, -70.1627]; // centro de República Dominicana
let map = null, mapPos = '', lReady = null;
function curPos() {
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  return validPos(lat, lon) ? [lat, lon] : null;
}
function loadLeaflet() {
  return lReady ||= new Promise((res, rej) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.crossOrigin = 'anonymous';
    l.integrity = 'sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==';
    l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    const s = document.createElement('script');
    s.crossOrigin = 'anonymous';
    s.integrity = 'sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==';
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = res;
    s.onerror = () => { lReady = null; l.remove(); s.remove(); rej(new Error('no cargó el mapa')); };
    document.head.append(l, s);
  });
}
async function buildMap() {
  await loadLeaflet();
  const p = curPos();
  // sin zoom por doble clic: cada clic mueve el pin
  const m = L.map('map', { doubleClickZoom: false }).setView(p || DR, p ? 17 : 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(m);
  const mk = L.marker(p || DR, { draggable: true });
  if (p) mk.addTo(m);
  m.on('click', e => pick(e.latlng.lat, e.latlng.lng, false));
  mk.on('dragend', () => { const q = mk.getLatLng(); pick(q.lat, q.lng, false); });
  mapPos = p ? p.join(',') : '';
  map = {
    show() { m.invalidateSize(); },
    set(lat, lon, pan) {
      mk.setLatLng([lat, lon]).addTo(m);
      if (pan) m.setView([lat, lon], Math.max(m.getZoom(), 16));
    }
  };
}
// Mueve el pin a las coordenadas escritas (solo si cambiaron)
function syncMap(pan = true) {
  const p = curPos();
  if (!map || !p) return;
  const k = p.join(',');
  if (k === mapPos) return;
  mapPos = k;
  map.set(p[0], p[1], pan);
}
$('mapBtn').onclick = async () => {
  const box = $('mapBox');
  box.hidden = !box.hidden;
  if (box.hidden) return;
  if (map) return map.show(); // recalcula tamaño por si se creó o cambió estando oculto
  $('mapSrc').textContent = 'cargando mapa…';
  try { await buildMap(); $('mapSrc').textContent = ''; map.show(); }
  catch { $('mapSrc').textContent = 'no se pudo cargar el mapa'; }
};
let searchReq = 0;
async function search() {
  const q = $('q').value.trim(), id = ++searchReq;
  if (!q) return;
  const m = q.match(COORD_RE);
  if (m && validPos(+m[1], +m[2]) && /^[-\d.,;\s]+$/.test(q)) return pick(m[1], m[2], true);
  $('mapSrc').textContent = 'buscando…';
  // viewbox = preferir República Dominicana (sin excluir el resto del mundo)
  const j = await nominatim(`search?limit=1&viewbox=-72.1,20.0,-68.3,17.4&bounded=0&q=${encodeURIComponent(q)}`);
  if (id !== searchReq) return; // hubo otra búsqueda después
  $('mapSrc').textContent = '';
  if (!Array.isArray(j) || !j[0]) return alert('No se encontró el lugar');
  pick(+j[0].lat, +j[0].lon, true);
}
$('qBtn').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });

// ---------- Fecha por defecto: ahora ----------
(() => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); $('dt').value = d.toISOString().slice(0, 16); })();

// ---------- Texto de la marca ----------
function fmtDate(v) {
  if (!v) return '';
  const [date, time] = v.split('T');
  const [y, m, d] = date.split('-').map(Number);
  let [h, mi] = time.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${d} de ${MESES[m - 1]} ${y} ${h}:${String(mi).padStart(2, '0')} ${ap}`;
}
function fmtCoords(lat, lon) {
  if (lat === '' || lon === '') return '';
  lat = +lat; lon = +lon;
  return `${Math.abs(lat).toFixed(6)}°${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lon).toFixed(6)}°${lon >= 0 ? 'E' : 'W'}`;
}
const getData = () => ({ date: fmtDate($('dt').value), addr: $('addr').value.trim(), coords: fmtCoords($('lat').value.trim(), $('lon').value.trim()) });

function wrap(ctx, text, maxW) {
  const out = [];
  text.split('\n').forEach(par => {
    let line = '';
    par.split(' ').forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    });
    out.push(line);
  });
  return out;
}

// Dibuja imagen + marca de agua en un canvas de w x h
function draw(canvas, img, w, h, data) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const fs = Math.min(w, h) * 0.032;
  const lh = fs * 1.3, gap = fs * 0.75;
  ctx.font = `500 ${fs}px Roboto, "Segoe UI", Arial, sans-serif`;
  const maxW = w * 0.8;
  const blocks = [];
  if (data.date) blocks.push([data.date]);
  if (data.addr) blocks.push(wrap(ctx, data.addr, maxW));
  if (data.coords) blocks.push([data.coords]);
  if (!blocks.length) return;
  const lines = blocks.reduce((n, b) => n + b.length, 0);
  const totalH = lines * lh + (blocks.length - 1) * gap;
  const x0 = w * 0.03, bottom = h - h * 0.03;
  let y = bottom - totalH;
  // barra amarilla
  ctx.fillStyle = '#f5c518';
  ctx.fillRect(x0, y, fs * 0.14, totalH);
  // texto
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(0,0,0,.75)';
  ctx.shadowBlur = fs * 0.2;
  ctx.shadowOffsetY = fs * 0.04;
  const tx = x0 + fs * 0.6;
  blocks.forEach((b, i) => {
    b.forEach(l => { ctx.fillText(l, tx, y + (lh - fs) / 2); y += lh; });
    if (i < blocks.length - 1) y += gap;
  });
}

// ---------- Fotos ----------
async function addFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    try {
      const full = await createImageBitmap(file);
      const s = Math.min(1, 700 / Math.max(full.width, full.height));
      const prev = await createImageBitmap(full, { resizeWidth: Math.round(full.width * s), resizeHeight: Math.round(full.height * s), resizeQuality: 'medium' });
      full.close();
      const p = { file, prev, canvas: document.createElement('canvas') };
      photos.push(p);
      const div = document.createElement('div');
      div.className = 'th';
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕';
      x.onclick = () => { photos = photos.filter(q => q !== p); div.remove(); p.prev.close(); updateCount(); };
      const dl = document.createElement('button'); dl.className = 'dl'; dl.textContent = 'Descargar';
      dl.onclick = () => tryDownload(p);
      div.append(p.canvas, x, dl);
      $('thumbs').append(div);
      draw(p.canvas, prev, prev.width, prev.height, getData());
    } catch (e) { alert('No se pudo abrir ' + file.name); }
  }
  updateCount();
}
function updateCount() {
  $('count').textContent = photos.length ? `${photos.length} foto(s)` : '';
  $('dlAll').disabled = !photos.length;
}
let t;
function refresh() {
  clearTimeout(t);
  t = setTimeout(() => { syncMap(); const d = getData(); photos.forEach(p => draw(p.canvas, p.prev, p.prev.width, p.prev.height, d)); }, 80);
}
['addr', 'lat', 'lon', 'dt'].forEach(id => $(id).addEventListener('input', refresh));

async function render(img, s) {
  const c = document.createElement('canvas');
  try {
    draw(c, img, Math.round(img.width * s), Math.round(img.height * s), getData());
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  } catch { return null; } finally { c.width = c.height = 0; }
}
async function download(p) {
  const img = await createImageBitmap(p.file);
  // si la foto supera el límite de canvas del navegador (p. ej. iPhone ~16 MP), se reduce
  const blob = await render(img, 1) || await render(img, Math.min(1, Math.sqrt(16e6 / (img.width * img.height))));
  img.close();
  if (!blob) throw new Error('imagen demasiado grande');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = p.file.name.replace(/\.[^.]+$/, '') + '_marca.jpg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const tryDownload = p => download(p).catch(() => alert('No se pudo guardar ' + p.file.name));
$('dlAll').onclick = async () => {
  $('dlAll').disabled = true;
  for (const p of [...photos]) { await tryDownload(p); await sleep(300); }
  $('dlAll').disabled = !photos.length;
};
$('clear').onclick = () => { photos.forEach(p => p.prev.close()); photos = []; $('thumbs').innerHTML = ''; updateCount(); };

// ---------- Drag & drop / explorador ----------
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
// evitar que el navegador abra la imagen si se suelta fuera de la zona
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.target !== drop && !drop.contains(e.target)) addFiles([...e.dataTransfer.files]); });

renderLocs();
</script>
</body>
</html>
